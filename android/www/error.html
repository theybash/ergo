<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ergo</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f0e0d; color: #ece8e1;
         font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  p { max-width: 22em; margin: 0 0 16px; }
  .quiet { color: #9a948b; font-size: 14px; }
  button { background: #161412; color: #ece8e1; border: 1px solid #2a2724; border-radius: 10px; padding: 10px 20px; font: inherit; margin: 4px; }
</style>
</head>
<body>
<div>
  <p>Ergo cannot reach your laptop.</p>
  <p class="quiet">Check that the daemon runs and that this phone can reach the laptop, then try again.</p>
  <button onclick="location.href='ergo://retry'">Try again</button>
  <button onclick="location.href='ergo://setup'">Change address</button>
</div>
</body>
</html>
